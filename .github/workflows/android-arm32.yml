name: SAJI PC ARM32 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build ARM32 debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAJI-PC-ARM32-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare direct APK download and checksum
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/SAJI-PC-ARM32-debug.apk
          sha256sum release-artifacts/SAJI-PC-ARM32-debug.apk > release-artifacts/SAJI-PC-ARM32-debug.apk.sha256

      - name: Publish direct ARM32 APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest \
              release-artifacts/SAJI-PC-ARM32-debug.apk \
              release-artifacts/SAJI-PC-ARM32-debug.apk.sha256 --clobber
          else
            gh release create apk-latest \
              release-artifacts/SAJI-PC-ARM32-debug.apk \
              release-artifacts/SAJI-PC-ARM32-debug.apk.sha256 \
              --title "SAJI PC ARM32 APK" \
              --notes "SAJI PC ARM32 debug APK. Install on compatible armeabi-v7a Android devices." \
              --prerelease --target "$GITHUB_SHA"
          fi
