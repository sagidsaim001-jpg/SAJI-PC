name: SAJI PC PRoot Android ARM32 native build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/proot-android-arm32.yml"
      - "runtime/**"

permissions:
  contents: write

env:
  NDK_VERSION: r29
  ANDROID_API: "24"
  TALLOC_VERSION: "2.5.0"
  PROOT_VERSION: "5.1.107.102"

jobs:
  build-proot-android-arm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout SAJI PC
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make git wget unzip zip file binutils python3

      - name: Download Android NDK r29
        run: |
          mkdir -p "$RUNNER_TEMP/android-ndk"
          cd "$RUNNER_TEMP/android-ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          rm android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK=$RUNNER_TEMP/android-ndk/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure ARMv7 Android toolchain
        run: |
          TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/bin/armv7a-linux-androideabi${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "OBJCOPY=$TOOLCHAIN/bin/llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=$TOOLCHAIN/bin/llvm-objdump" >> "$GITHUB_ENV"
          echo "OPTFLAGS=-O3 -fdata-sections -ffunction-sections" >> "$GITHUB_ENV"
          echo "OPTLDFLAGS=-Wl,--gc-sections -Wl,-s" >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/armv7a-linux-androideabi${ANDROID_API}-clang" --version

      - name: Build static ARM32 talloc dependency
        run: |
          wget -q https://www.samba.org/ftp/talloc/talloc-${TALLOC_VERSION}.tar.gz
          tar xf talloc-${TALLOC_VERSION}.tar.gz
          cd talloc-${TALLOC_VERSION}

          cat > cross-answers.txt <<'EOF'
          Checking uname sysname type: "Linux"
          Checking uname machine type: "dontcare"
          Checking uname release type: "dontcare"
          Checking uname version type: "dontcare"
          Checking simple C program: OK
          building library support: OK
          Checking for large file support: OK
          Checking for -D_FILE_OFFSET_BITS=64: OK
          Checking for WORDS_BIGENDIAN: OK
          Checking for C99 vsnprintf: OK
          Checking for HAVE_SECURE_MKSTEMP: OK
          rpath library support: OK
          -Wl,--version-script support: FAIL
          Checking correct behavior of strtoll: OK
          Checking correct behavior of strptime: OK
          Checking for HAVE_IFACE_GETIFADDRS: OK
          Checking for HAVE_IFACE_IFCONF: OK
          Checking for HAVE_IFACE_IFREQ: OK
          Checking getconf LFS_CFLAGS: OK
          Checking for large file support without additional flags: OK
          Checking for working strptime: OK
          Checking for HAVE_SHARED_MMAP: OK
          Checking for HAVE_MREMAP: OK
          Checking for HAVE_INCOHERENT_MMAP: OK
          Checking getconf large file support flags work: OK
          EOF

          CC="$CC" CFLAGS="$OPTFLAGS" LDFLAGS="" ./configure \
            --cross-compile --cross-answers=cross-answers.txt \
            --disable-python --disable-rpath
          make -j"$(nproc)"
          cd bin/default
          "$AR" rcs libtalloc.a talloc*.o
          "$RANLIB" libtalloc.a
          test -s libtalloc.a

      - name: Fetch pinned Android-compatible PRoot source
        run: |
          git clone --depth 1 --branch "v${PROOT_VERSION}" \
            https://github.com/termux/proot.git proot-src
          sed -i '1i#include <string.h>' \
            proot-src/src/extension/ashmem_memfd/ashmem_memfd.c
          grep -q 'PROOT_WITH_LIBANDROID_SHMEM' proot-src/src/GNUmakefile

      - name: Build PRoot and ARM loader with Android NDK
        run: |
          cd proot-src
          make -C src \
            CC="$CC" AR="$AR" STRIP="$STRIP" \
            OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
            CFLAGS="$OPTFLAGS -DARG_MAX=131072 -I../../talloc-${TALLOC_VERSION}" \
            LDFLAGS="$OPTLDFLAGS ../../talloc-${TALLOC_VERSION}/bin/default/libtalloc.a -Wl,-z,noexecstack" \
            V=1 loader proot

          test -x src/proot
          test -x src/loader/loader
          file src/proot src/loader/loader
          "$TOOLCHAIN/bin/llvm-readelf" -h src/proot | grep -E 'Class:|Machine:'
          "$TOOLCHAIN/bin/llvm-readelf" -d src/proot > ../proot-dynamic.txt
          cat ../proot-dynamic.txt

      - name: Package PRoot Android ARM32 runtime
        run: |
          mkdir -p runtime-artifact
          install -m 0755 proot-src/src/proot runtime-artifact/libproot.so
          install -m 0755 proot-src/src/loader/loader runtime-artifact/libproot-loader.so
          tar -czf runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
            -C runtime-artifact libproot.so libproot-loader.so
          sha256sum runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
            > runtime-artifact/PRoot-SHA256SUMS
          sha256sum runtime-artifact/libproot.so runtime-artifact/libproot-loader.so \
            > runtime-artifact/BINARY-SHA256SUMS
          ls -lh runtime-artifact/

      - name: Upload Android ARM32 PRoot runtime
        uses: actions/upload-artifact@v4
        with:
          name: SAJI-PC-PRoot-Android-ARM32
          path: runtime-artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android ARM32 PRoot release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view proot-latest >/dev/null 2>&1; then
            gh release upload proot-latest \
              runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
              runtime-artifact/PRoot-SHA256SUMS --clobber
          else
            gh release create proot-latest \
              runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
              runtime-artifact/PRoot-SHA256SUMS \
              --title "SAJI PC Android ARM32 PRoot" \
              --notes "Android ARM32 PRoot built from Termux-compatible source with static talloc." \
              --prerelease --target "$GITHUB_SHA"
          fi
