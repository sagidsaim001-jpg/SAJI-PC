name: SAJI PC PRoot Android ARM32 runtime build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/proot-android-arm32.yml"
      - "runtime/**"

permissions:
  contents: write

jobs:
  build-proot-android-arm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout SAJI PC
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust with Android ARM32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-linux-androideabi

      - name: Install target for pinned upstream nightly
        run: rustup target add --toolchain nightly-2021-03-24 arm-linux-androideabi

      - name: Fetch pinned upstream PRoot-rs
        run: |
          git clone https://github.com/proot-me/proot-rs.git proot-rs-src
          git -C proot-rs-src checkout cd918286fa600f395c30c2d8a5c12274912c35c6
          mkdir -p proot-rs-src/.cargo
          cat > proot-rs-src/.cargo/config.toml <<EOF
          [target.arm-linux-androideabi]
          linker = "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          EOF
          cat proot-rs-src/.cargo/config.toml

      - name: Build PRoot-rs and loader shim
        working-directory: proot-rs-src
        env:
          CARGO_BUILD_TARGET: arm-linux-androideabi
          CC_arm_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang
          AR_arm_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          set -euxo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_arm_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export AR_arm_linux_androideabi="$NDK_BIN/llvm-ar"
          export CFLAGS_arm_linux_androideabi="--target=armv7a-linux-androideabi26"
          # Build the no_std loader using the upstream pinned nightly, embed it in PRoot,
          # then build the actual Android ARM32 PRoot executable directly with Cargo.
          RUSTFLAGS="-C panic=abort -C link-self-contained=no" \
            cargo +nightly-2021-03-24 build --locked --bin=loader-shim \
            --features=build-binary --target=arm-linux-androideabi --release
          install -m 0755 target/arm-linux-androideabi/release/loader-shim \
            proot-rs/src/kernel/execve/loader-shim
          cargo +nightly-2021-03-24 build --locked --bin=proot-rs \
            --target=arm-linux-androideabi --release
          mkdir -p ../runtime-artifact
          install -m 0755 target/arm-linux-androideabi/release/proot-rs \
            ../runtime-artifact/libproot.so
          install -m 0755 target/arm-linux-androideabi/release/loader-shim \
            ../runtime-artifact/libproot-loader.so

      - name: Verify Android ARM32 PRoot artifacts
        run: |
          file runtime-artifact/libproot.so runtime-artifact/libproot-loader.so
          readelf -h runtime-artifact/libproot.so | grep -E 'Class:|Machine:'
          readelf -h runtime-artifact/libproot-loader.so | grep -E 'Class:|Machine:'
          sha256sum runtime-artifact/* > runtime-artifact/SHA256SUMS
          tar -czf runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
            -C runtime-artifact libproot.so libproot-loader.so
          sha256sum runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
            > runtime-artifact/PRoot-SHA256SUMS

      - name: Upload Android ARM32 PRoot runtime
        uses: actions/upload-artifact@v4
        with:
          name: SAJI-PC-PRoot-Android-ARM32
          path: runtime-artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android ARM32 PRoot release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view proot-latest >/dev/null 2>&1; then
            gh release upload proot-latest \
              runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
              runtime-artifact/PRoot-SHA256SUMS --clobber
          else
            gh release create proot-latest \
              runtime-artifact/SAJI-PC-PRoot-Android-ARM32.tar.gz \
              runtime-artifact/PRoot-SHA256SUMS \
              --title "SAJI PC Android ARM32 PRoot" \
              --notes "Android ARM32 PRoot-rs executable and loader shim." \
              --prerelease --target "$GITHUB_SHA"
          fi
